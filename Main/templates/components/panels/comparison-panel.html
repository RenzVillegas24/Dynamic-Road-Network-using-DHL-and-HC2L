<!-- Algorithm Comparison Panel -->
<div id="algorithm-comparison-panel" class="panel flex flex-col overflow-hidden">
  <div class="panel__header panel__header--primary flex-shrink-0">
    <div class="panel__icon">
      <i data-lucide="git-compare" class="w-6 h-6"></i>
    </div>
    <div class="panel__title-group">
      <h2 class="panel__title">Algorithm Comparison</h2>
      <p class="panel__subtitle">Compare routing algorithms side-by-side</p>
    </div>
    <button onclick="closeComparisonPanel()" class="panel__close">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
  </div>

  <div class="panel__body flex-grow overflow-y-auto space-y-5">
    <!-- Algorithm Selector -->
    <div class="section-card">
      <div class="section-card__header">
        <div class="section-card__icon section-card__icon--primary">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
        </div>
        <h3 class="section-card__title">Select Algorithms to Compare</h3>
      </div>
      <div class="nav-select">
        <label class="nav-select__option" data-color="amber">
          <input type="checkbox" id="compare-google" class="nav-select__input">
          <div class="nav-select__icon"><i data-lucide="map" class="w-5 h-5"></i></div>
          <div class="nav-select__content">
            <span class="nav-select__title">Google Maps</span>
          </div>
        </label>
        <label class="nav-select__option" data-color="emerald">
          <input type="checkbox" id="compare-dhl" class="nav-select__input" checked>
          <div class="nav-select__icon"><i data-lucide="layers" class="w-5 h-5"></i></div>
          <div class="nav-select__content">
            <span class="nav-select__title">DHL</span>
            <span class="nav-select__description">Dual-Hierarchy Labeling</span>
          </div>
        </label>
        <label class="nav-select__option" data-color="blue">
          <input type="checkbox" id="compare-hc2l" class="nav-select__input" checked>
          <div class="nav-select__icon"><i data-lucide="layers" class="w-5 h-5"></i></div>
          <div class="nav-select__content">
            <span class="nav-select__title">HC2L</span>
            <span class="nav-select__description">Hierarchical Cut 2-Hop</span>
          </div>
        </label>
      </div>
      <button onclick="runComparison()" class="btn btn--primary btn--lg btn--block mt-4">
        Run Comparison
      </button>
    </div>

    <!-- Metrics Comparison Table -->
    <div id="comparison-metrics-container" class="hidden">
      <div class="section-card">
        <div class="section-card__header">
          <div class="section-card__icon section-card__icon--purple">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          </div>
          <h3 class="section-card__title">Performance Comparison</h3>
        </div>
        <div id="comparison-metrics-table" class="section-card__body overflow-x-auto">
          <!-- Comparison table will be inserted here -->
        </div>
      </div>
    </div>

    <!-- Route Details Expandable Sections -->
    <div id="comparison-route-details" class="hidden space-y-3">
      <!-- Route details cards will be inserted here -->
    </div>

    <!-- Color Legend -->
    <div class="legend-card">
      <h4 class="legend-card__title">Color Legend</h4>
      <div class="legend-card__items">
        <div class="legend-item">
          <div class="legend-item__dot legend-item__dot--warning"></div>
          <span class="legend-item__label">Google Maps</span>
        </div>
        <div class="legend-item">
          <div class="legend-item__dot legend-item__dot--primary"></div>
          <span class="legend-item__label">DHL</span>
        </div>
        <div class="legend-item">
          <div class="legend-item__dot legend-item__dot--info"></div>
          <span class="legend-item__label">HC2L</span>
        </div>
      </div>
    </div>
  </div>
</div>
