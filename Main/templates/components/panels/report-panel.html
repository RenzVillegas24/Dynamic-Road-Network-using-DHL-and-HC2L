<!-- Report Incident Panel -->
<div id="report-panel" class="panel panel--lg">
  <div class="panel__header panel__header--purple">
    <div class="panel__icon">
      <i data-lucide="alert-triangle" class="w-6 h-6"></i>
    </div>
    <div class="panel__title-group">
      <h2 class="panel__title">Report Disruption</h2>
      <p class="panel__subtitle">Help others navigate better</p>
    </div>
    <button id="report-close" class="panel__close">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
  </div>

  <div class="panel__body">
    <form class="space-y-5" id="report-form">
      <!-- Incident Location -->
      <div class="form-group">
        <label class="form-group__label">Incident Location</label>
        <button type="button" id="pin-disruption-btn" class="pin-button">
          <i data-lucide="map-pin" class="pin-button__icon"></i>
          <span id="pin-disruption-text">Click to pin location on map</span>
        </button>
        <div id="disruption-coords" class="badge badge--primary badge--lg hidden mt-3 w-full justify-center"></div>
      </div>

      <!-- Incident Type -->
      <div class="form-group">
        <label class="form-group__label">Incident Type</label>
        <select id="disruption-type" class="form-select">
          <option value="">Select incident type...</option>
          <option value="accident">Accident</option>
          <option value="construction">Construction Work</option>
          <option value="congestion">Heavy Congestion</option>
          <option value="disabled-vehicle">Disabled Vehicle</option>
          <option value="mass-transit">Mass Transit Event</option>
          <option value="planned-event">Planned Event</option>
          <option value="road-hazard">Road Hazard</option>
          <option value="road-closure">Road Closure</option>
          <option value="weather">Severe Weather</option>
          <option value="lane-restriction">Lane Restriction</option>
        </select>
      </div>

      <!-- Incident Criticality -->
      <div class="form-group">
        <label class="form-group__label">Incident Criticality</label>
        <div class="nav-select">
          <label class="nav-select__option nav-select--emerald">
            <input type="radio" name="criticality" value="low">
            <span class="nav-select__icon"><i data-lucide="minus-circle" class="w-4 h-4"></i></span>
            <div class="nav-select__content">
              <span class="nav-select__title">Low Impact</span>
              <span class="nav-select__description">Minor disruption</span>
            </div>
          </label>
          <label class="nav-select__option nav-select--amber">
            <input type="radio" name="criticality" value="minor" checked>
            <span class="nav-select__icon"><i data-lucide="alert-circle" class="w-4 h-4"></i></span>
            <div class="nav-select__content">
              <span class="nav-select__title">Minor Impact</span>
              <span class="nav-select__description">Moderate slowdown</span>
            </div>
          </label>
          <label class="nav-select__option nav-select--orange">
            <input type="radio" name="criticality" value="major">
            <span class="nav-select__icon"><i data-lucide="alert-triangle" class="w-4 h-4"></i></span>
            <div class="nav-select__content">
              <span class="nav-select__title">Major Impact</span>
              <span class="nav-select__description">Significant delays</span>
            </div>
          </label>
          <label class="nav-select__option nav-select--red">
            <input type="radio" name="criticality" value="critical">
            <span class="nav-select__icon"><i data-lucide="x-circle" class="w-4 h-4"></i></span>
            <div class="nav-select__content">
              <span class="nav-select__title">Critical Impact</span>
              <span class="nav-select__description">Severe disruption or closure</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Road Closure Section -->
      <div class="section-card section-card--error">
        <div class="form-switch">
          <input type="checkbox" id="incident-road-closed" class="form-switch__input">
          <span class="form-switch__slider"></span>
          <div class="form-switch__label">
            <span class="font-semibold">Road is Completely Closed</span>
            <p class="text-xs text-muted">Mark as impassable</p>
          </div>
        </div>
      </div>

      <!-- Time Range Section -->
      <div class="stat-grid stat-grid--2">
        <div class="form-group">
          <label class="form-group__label">Start Time (Optional)</label>
          <input type="datetime-local" id="incident-start-time" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-group__label">End Time (Optional)</label>
          <input type="datetime-local" id="incident-end-time" class="form-input">
        </div>
      </div>

      <!-- Description Field -->
      <div class="form-group">
        <label class="form-group__label">Additional Details (Optional)</label>
        <textarea id="disruption-description" class="form-textarea" rows="3"
          placeholder="Describe what you observed (e.g., accident details, lane closures, etc.)"></textarea>
      </div>

      <!-- User-reported incidents management -->
      <div class="section-card section-card--slate">
        <div class="section-card__header">
          <div class="section-card__icon section-card__icon--primary">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
          </div>
          <div class="flex-1">
            <h3 class="section-card__title">Saved Pins</h3>
            <p class="text-xs text-muted">Your manually added incidents</p>
          </div>
          <button type="button" id="refresh-user-disruptions" class="btn btn--ghost btn--sm">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="user-disruptions-empty" class="panel__empty panel__empty--compact hidden">
          <p class="panel__empty-text">No custom incidents yet</p>
        </div>
        <div id="user-disruptions-list" class="space-y-3"></div>
      </div>

      <button type="submit" class="btn btn--primary btn--lg btn--block">
        <i data-lucide="send" class="w-5 h-5"></i>
        Submit Report
      </button>
    </form>
  </div>
</div>
