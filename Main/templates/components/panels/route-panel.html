<!-- Current Path Panel -->
<div id="current-path-panel" class="panel">
  <div class="panel__header panel__header--success">
    <div class="panel__icon">
      <i data-lucide="route" class="w-6 h-6"></i>
    </div>
    <div class="panel__title-group">
      <h2 id="current-path-title" class="panel__title">Current Path</h2>
      <p class="panel__subtitle">Optimized route details</p>
    </div>
    <button class="panel__close">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>

  <div class="panel__body">
    <!-- Compact Route Summary -->
    <div class="stat-grid stat-grid--3 mb-4">
      <div class="stat-box stat-box--success">
        <div class="stat-box__label">Distance</div>
        <div id="route-distance" class="stat-box__value">--</div>
      </div>
      <div class="stat-box stat-box--primary">
        <div class="stat-box__label">Duration</div>
        <div id="route-duration" class="stat-box__value">--</div>
      </div>
      <div class="stat-box stat-box--purple">
        <div class="stat-box__label">Steps</div>
        <div id="route-steps-count" class="stat-box__value">--</div>
      </div>
    </div>

    <!-- Algorithm Metrics Section (Clickable) -->
    <div class="alert-card alert-card--primary mb-4" data-panel="metrics">
      <div class="alert-card__icon">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
      </div>
      <div class="alert-card__content">
        <div class="alert-card__title">Algorithm Metrics</div>
        <div class="alert-card__description">Performance & routing details</div>
      </div>
      <div class="alert-card__arrow">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- Enhanced Disruption Alert -->
    <div id="disruption-alert-container" class="hidden mb-4 alert-card alert-card--error" data-panel="disruptions">
      <div class="alert-card__icon">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
      </div>
      <div class="alert-card__content">
        <div class="alert-card__title" id="disruption-alert-title">Disruptions Detected</div>
        <div class="alert-card__description" id="disruption-alert-summary">Loading...</div>
        <div class="alert-card__meta" id="disruption-alert-impact">Time Impact: --</div>
      </div>
      <div class="alert-card__arrow">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- Route Steps (scrollable) -->
    <div class="card card--flat flex-1 overflow-y-auto p-4 min-h-0">
      <div id="route-steps" class="space-y-3">
        <div id="route-steps-placeholder" class="panel__empty">
          <div class="panel__empty-icon">
            <i data-lucide="map" class="w-10 h-10"></i>
          </div>
          <p class="panel__empty-title">No Route Yet</p>
          <p class="panel__empty-text">Pin locations and click "Go" to see turn-by-turn directions</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer actions -->
  <div class="panel__footer flex-column gap-3">
    <!-- Primary Compare Button -->
    <div id="current-path-google-compare-btn-container" class="w-full">
      <button id="current-path-google-compare-btn" data-action="comparison"
        class="btn btn--primary btn--block gap-3">
        <div class="btn--icon bg-white/10 p-2 rounded-xl">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 text-left">
          <div class="text-sm">Compare Route Algorithms</div>
          <div class="text-xs opacity-80 font-medium">DHL, HC2L, and Google Maps</div>
        </div>
      </button>
    </div>
  </div>
</div>
