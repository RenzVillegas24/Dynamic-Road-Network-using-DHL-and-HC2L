<!-- Developer View Panel (Logging) -->
<div id="developer-view-panel" class="panel flex flex-col">
  <div class="panel__header panel__header--success">
    <div class="panel__icon">
      <i data-lucide="terminal" class="w-6 h-6"></i>
    </div>
    <div class="panel__title-group">
      <h2 class="panel__title">Developer Console</h2>
      <p class="panel__subtitle">System logs and debugging</p>
    </div>
    <button onclick="closeDeveloperView()" class="panel__close">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- Log Controls -->
  <div class="log-controls">
    <!-- Actions Row -->
    <div class="log-controls__actions">
      <div class="log-controls__buttons">
        <button onclick="clearLogs()" class="btn btn--danger btn--sm">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          Clear
        </button>
        <button onclick="exportLogs()" class="btn btn--secondary btn--sm">
          <i data-lucide="download" class="w-4 h-4"></i>
          Export
        </button>
      </div>
      
      <div class="log-controls__toggles">
        <label class="toggle-switch">
          <span class="toggle-switch__label">Auto-scroll</span>
          <input type="checkbox" id="log-autoscroll" checked
                 onchange="LoggingSystem.autoScroll = this.checked">
          <span class="toggle-switch__track"></span>
        </label>
        <label class="toggle-switch toggle-switch--info">
          <span class="toggle-switch__label toggle-switch__label--info">Console</span>
          <input type="checkbox" id="console-log-toggle"
                 onchange="toggleConsoleLogging(this.checked)">
          <span class="toggle-switch__track"></span>
        </label>
        <label class="toggle-switch toggle-switch--success">
          <span class="toggle-switch__label toggle-switch__label--success">Backend</span>
          <input type="checkbox" id="backend-log-toggle"
                 onchange="toggleBackendLogging(this.checked)">
          <span class="toggle-switch__track"></span>
        </label>
      </div>
    </div>

    <!-- Source Indicators -->
    <div class="log-sources">
      <div class="log-source log-source--info">
        <span class="log-source__dot"></span>
        <span class="log-source__label">Web Console</span>
      </div>
      <div class="log-source log-source--success">
        <span class="log-source__dot"></span>
        <span class="log-source__label">Python Backend</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="log-controls__group">
      <span class="log-controls__group-label">Log Filters</span>
      <div class="log-filters">
        <label class="filter-chip filter-chip--debug">
          <input type="checkbox" id="filter-debug" checked onchange="toggleLogFilter('debug')">
          <span class="filter-chip__icon"><i data-lucide="wrench" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Debug</span>
        </label>
        <label class="filter-chip filter-chip--info">
          <input type="checkbox" id="filter-info" checked onchange="toggleLogFilter('info')">
          <span class="filter-chip__icon"><i data-lucide="info" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Info</span>
        </label>
        <label class="filter-chip filter-chip--success">
          <input type="checkbox" id="filter-success" checked onchange="toggleLogFilter('success')">
          <span class="filter-chip__icon"><i data-lucide="check-circle" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Success</span>
        </label>
        <label class="filter-chip filter-chip--warning">
          <input type="checkbox" id="filter-warning" checked onchange="toggleLogFilter('warning')">
          <span class="filter-chip__icon"><i data-lucide="alert-triangle" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Warning</span>
        </label>
        <label class="filter-chip filter-chip--error">
          <input type="checkbox" id="filter-error" checked onchange="toggleLogFilter('error')">
          <span class="filter-chip__icon"><i data-lucide="x-circle" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Error</span>
        </label>
        <label class="filter-chip filter-chip--query">
          <input type="checkbox" id="filter-query" checked onchange="toggleLogFilter('query')">
          <span class="filter-chip__icon"><i data-lucide="search" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Query</span>
        </label>
        <label class="filter-chip filter-chip--update">
          <input type="checkbox" id="filter-update" checked onchange="toggleLogFilter('update')">
          <span class="filter-chip__icon"><i data-lucide="refresh-cw" class="w-3 h-3"></i></span>
          <span class="filter-chip__label">Update</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Log Entries -->
  <div class="log-entries" id="log-entries-container">
    <!-- Log entries will be inserted here dynamically -->
  </div>
</div>
