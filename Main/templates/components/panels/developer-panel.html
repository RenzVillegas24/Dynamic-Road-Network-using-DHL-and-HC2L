<!-- Developer View Panel (Logging) -->
<div id="developer-view-panel" class="panel panel--xl flex flex-col">
  <div class="panel__header panel__header--success">
    <div class="panel__icon">
      <i data-lucide="code" class="w-6 h-6"></i>
    </div>
    <div class="panel__title-group">
      <h2 class="panel__title">Developer View</h2>
      <p class="panel__subtitle">System logs and debugging</p>
    </div>
    <button onclick="closeDeveloperView()" class="panel__close">
      <i data-lucide="x" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- Log Controls -->
  <div class="log-controls">
    <div class="log-controls__actions">
      <button onclick="clearLogs()" class="btn btn--danger btn--sm">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        Clear
      </button>
      <button onclick="exportLogs()" class="btn btn--info btn--sm">
        <i data-lucide="download" class="w-4 h-4"></i>
        Export
      </button>
      <label class="toggle-label">
        <span class="toggle-label__text">Auto-scroll</span>
        <input type="checkbox" id="log-autoscroll" checked class="toggle-checkbox"
               onchange="LoggingSystem.autoScroll = this.checked">
      </label>
      <label class="toggle-label">
        <span class="toggle-label__text toggle-label__text--info">Console</span>
        <input type="checkbox" id="console-log-toggle" class="toggle-checkbox"
               onchange="toggleConsoleLogging(this.checked)">
      </label>
      <label class="toggle-label">
        <span class="toggle-label__text toggle-label__text--success">Backend</span>
        <input type="checkbox" id="backend-log-toggle" class="toggle-checkbox"
               onchange="toggleBackendLogging(this.checked)">
      </label>
    </div>

    <!-- Source Indicators -->
    <div class="log-sources">
      <div class="log-source log-source--info">
        <span class="log-source__dot"></span>
        <span class="log-source__label">Web Console</span>
      </div>
      <div class="log-source log-source--success">
        <span class="log-source__dot"></span>
        <span class="log-source__label">Python Backend</span>
      </div>
    </div>

    <!-- Filters -->
    <div class="log-filters">
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-debug" checked onchange="toggleLogFilter('debug')">
        <span class="filter-checkbox__label"><i data-lucide="wrench" class="w-3 h-3 inline"></i> Debug</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-info" checked onchange="toggleLogFilter('info')">
        <span class="filter-checkbox__label"><i data-lucide="info" class="w-3 h-3 inline"></i> Info</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-success" checked onchange="toggleLogFilter('success')">
        <span class="filter-checkbox__label"><i data-lucide="check-circle" class="w-3 h-3 inline"></i> Success</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-warning" checked onchange="toggleLogFilter('warning')">
        <span class="filter-checkbox__label"><i data-lucide="alert-triangle" class="w-3 h-3 inline"></i> Warning</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-error" checked onchange="toggleLogFilter('error')">
        <span class="filter-checkbox__label"><i data-lucide="x-circle" class="w-3 h-3 inline"></i> Error</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-query" checked onchange="toggleLogFilter('query')">
        <span class="filter-checkbox__label"><i data-lucide="search" class="w-3 h-3 inline"></i> Query</span>
      </label>
      <label class="filter-checkbox">
        <input type="checkbox" id="filter-update" checked onchange="toggleLogFilter('update')">
        <span class="filter-checkbox__label"><i data-lucide="refresh-cw" class="w-3 h-3 inline"></i> Update</span>
      </label>
    </div>
  </div>

  <!-- Log Entries -->
  <div class="log-entries" id="log-entries-container">
    <!-- Log entries will be inserted here dynamically -->
  </div>
</div>
