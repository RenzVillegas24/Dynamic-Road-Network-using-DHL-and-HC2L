<!-- Header Component -->
<header class="header">
    <!-- Brand Section -->
    <div class="header__brand">
        <button class="header__toggle" id="sidebar-toggle" title="Toggle Sidebar">
            <i data-lucide="chevrons-left"></i>
        </button>
        <div class="header__logo">
            <i data-lucide="map"></i>
        </div>
        <div>
            <h1 class="header__title">REACT</h1>
            <p class="header__subtitle">Intelligent Route Planning</p>
        </div>
    </div>

    <!-- Search Section -->
    <div class="header__search">
        <!-- Start Location -->
        <div class="search-combobox" id="start-location-search">
            <div class="search-combobox__wrapper">
                <input type="text" 
                       id="start-location-input" 
                       class="search-combobox__input" 
                       placeholder="Search start location..."
                       autocomplete="off">
                <button class="search-combobox__pin-btn search-combobox__pin-btn--success" 
                        id="start-location-pin-btn" 
                        title="Pin on map">
                    <i data-lucide="map-pin"></i>
                </button>
            </div>
            <div class="search-combobox__dropdown" id="start-location-dropdown"></div>
        </div>

        <!-- Arrow Separator -->
        <div class="search-separator">
            <i data-lucide="chevron-right"></i>
        </div>

        <!-- Destination Location -->
        <div class="search-combobox" id="dest-location-search">
            <div class="search-combobox__wrapper">
                <input type="text" 
                       id="dest-location-input" 
                       class="search-combobox__input" 
                       placeholder="Search destination..."
                       autocomplete="off">
                <button class="search-combobox__pin-btn search-combobox__pin-btn--danger" 
                        id="dest-location-pin-btn" 
                        title="Pin on map">
                    <i data-lucide="map-pin"></i>
                </button>
            </div>
            <div class="search-combobox__dropdown" id="dest-location-dropdown"></div>
        </div>

        <!-- Go Button -->
        <button id="go-button" class="header__go-btn">
            <div class="header__go-btn-icon">
                <i data-lucide="route"></i>
            </div>
            <span id="new-dataset-text" class="header__go-btn-text">Route</span>
        </button>
    </div>

    <!-- Actions Section -->
    <div class="header__actions">
        <!-- 
        <div class="dropdown" id="algo-dropdown">
            <button class="header__action-btn">
                <div class="header__action-btn-icon">

                </div>
                <span id="selected-algo-label">LazyDHL</span>
                <i data-lucide="chevron-down"></i>
            </button>
        </div>

        <div class="dropdown" id="traffic-dropdown">
            <button class="header__action-btn">
                <div class="header__action-btn-icon">
                    <i data-lucide="traffic-cone"></i>
                </div>
                <span id="selected-traffic-label">With Traffic</span>
                <i data-lucide="chevron-down"></i>
            </button>
        </div> 
        -->

</header>
