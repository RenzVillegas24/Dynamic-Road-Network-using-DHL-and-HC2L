channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Geographic/GIS libraries with version compatibility
  - gdal
  - geopandas>=0.14
  - pyogrio>=0.7
  - shapely>=2.0
  - pyproj>=3.5
  - osmnx>=1.9
  # Data processing
  - pandas
  - numpy
  - networkx
  # Visualization
  - matplotlib>=3.7
  # Additional dependencies via pip
  - pip
  - pip:
    - Flask==3.1.2
    - Werkzeug==3.1.3
    - requests==2.32.5
    - python-dotenv==1.1.1
