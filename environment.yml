channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Geographic/GIS libraries (let conda-forge resolve compatible builds)
  - gdal
  - geopandas
  - pyogrio
  - shapely
  - pyproj
  - osmnx
  # Data processing
  - pandas
  - numpy
  - networkx
  # Visualization
  - matplotlib>=3.7
  # Additional dependencies via pip
  - pip
  - pip:
    - Flask==3.1.2
    - Werkzeug==3.1.3
    - requests==2.32.5
    - python-dotenv==1.1.1
